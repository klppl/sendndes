# XcodeGen spec for send n*des for iPhone. The generated .xcodeproj is not committed (see .gitignore).
#   brew install xcodegen          (the owner installs it; the build scripts do not)
#   cp Local.xcconfig.example Local.xcconfig   and fill in DEVELOPMENT_TEAM
#   xcodegen && open SendndesIOS.xcodeproj
name: SendndesIOS
options:
  bundleIdPrefix: se.klippel.sendndes
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
packages:
  SendndesIOS:
    path: .
targets:
  Sendndes:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Info.plist", "Sendndes.entitlements"]
      - path: Resources
    dependencies:
      - package: SendndesIOS
        product: SenderUI
      - target: ShareExtension
        embed: true
    entitlements:
      path: App/Sendndes.entitlements
      properties:
        com.apple.security.application-groups: [group.se.klippel.sendndes]
        keychain-access-groups: ["$(AppIdentifierPrefix)se.klippel.sendndes.shared"]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "send n*des"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSCameraUsageDescription: "send n*des uses the camera only to scan the pairing QR code from your Mac."
        KeychainAccessGroup: "$(AppIdentifierPrefix)se.klippel.sendndes.shared"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.klippel.sendndes.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        # No ATS exceptions anywhere: the app only talks https.
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes: ["Info.plist", "ShareExtension.entitlements"]
    dependencies:
      - package: SendndesIOS
        product: SenderUI
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.se.klippel.sendndes]
        keychain-access-groups: ["$(AppIdentifierPrefix)se.klippel.sendndes.shared"]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: "send n*des"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        KeychainAccessGroup: "$(AppIdentifierPrefix)se.klippel.sendndes.shared"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 20
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsMovieWithMaxCount: 20
              NSExtensionActivationSupportsWebURLWithMaxCount: 20
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.klippel.sendndes.ios.share
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  Sendndes:
    build:
      targets:
        Sendndes: all
        ShareExtension: all
    run:
      config: Debug
