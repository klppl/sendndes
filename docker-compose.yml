# ndes sync server. Start with:  docker compose up -d
# Setup code for the web GUI:     docker compose logs ndesd
services:
  ndesd:
    build: .
    restart: unless-stopped
    # Only if the GUI is behind a Cloudflare Tunnel / reverse proxy. Protect the
    # hostname with a Cloudflare Access policy too (see cmd/ndesd/DEPLOY.md).
    # environment:
    #   NDESD_ADMIN_BEHIND_PROXY: "1"
    volumes:
      - ndesd-data:/data
    ports:
      # Admin web GUI: bound to this machine only. Reach it from elsewhere over
      # an SSH tunnel or Tailscale (use "<tailscale-ip>:8080:8080").
      - "127.0.0.1:8080:8080"
      # Sync port your devices connect to. Plain HTTP: put it on Tailscale/VPN
      # ("<tailscale-ip>:8485:8485") or behind an HTTPS reverse proxy.
      - "8485:8485"
volumes:
  ndesd-data:
